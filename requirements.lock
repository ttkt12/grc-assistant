# Sinh ngày 2026-09-08 trên: macOS arm64 (Apple Silicon), CPython 3.12.14,
# bằng `pip install -r requirements.txt` (KHÔNG dùng constraints.txt).
#
# Mức độ đã verify: `python predeploy_check.py` chạy qua các mục không cần
# secret — `rag_core import: ok`, `teams_bot import: ok`,
# `document_catalog.json: 52 documents`. Chưa verify runtime hỏi-đáp thật
# (cần AI_PLATFORM_API_KEY + vector_db/).
#
# `requirements.txt` không pin version nên mỗi lần cài mới sẽ nhận bản mới nhất
# trên PyPI. Bộ dưới đây lệch major khá nhiều so với máy cũ (langchain-core 1.x,
# transformers 5.x, openai 3.x, sentence-transformers 6.x) — dùng file này khi
# muốn dựng lại đúng môi trường này thay vì hứng bản mới nhất.
#
# Dùng:
#   pip install -r requirements.lock
#
# CHỈ dành cho macOS/dev local. Docker + CI vẫn đi đường riêng:
# `torch==2.12.0+cpu` từ PyTorch CPU index qua constraints.txt (xem Dockerfile) —
# `torch==2.14.0` bên dưới là wheel macOS, không có bản +cpu tương ứng.
